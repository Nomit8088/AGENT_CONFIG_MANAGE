<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentHub - 多 Agent 通用配置与规则管理器</title>
    <script>
      (function() {
        try {
          const cachedTheme = localStorage.getItem('agenthub_theme');
          let isDark = false;
          if (cachedTheme === 'dark') {
            isDark = true;
          } else if (cachedTheme === 'light') {
            isDark = false;
          } else {
            // Default to system preference
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-dark-950 text-slate-900 dark:text-slate-200 antialiased selection:bg-brand-500 selection:text-white font-sans overflow-hidden select-none">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
