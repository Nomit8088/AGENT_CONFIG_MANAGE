<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan/Sky Secondary Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Indigo Tertiary Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Container -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Subtle Inner Border Glow -->
  <rect x="40" y="40" width="944" height="944" rx="212" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="4"/>

  <!-- Central Multi-Layer Hub Emblem -->
  <!-- Top Layer (Indigo) -->
  <path d="M512 210 L790 350 L512 490 L234 350 Z" fill="url(#indigoGrad)" fill-opacity="0.85" filter="url(#glow)"/>
  <path d="M512 210 L790 350 L512 490 L234 350 Z" fill="none" stroke="#c4b5fd" stroke-width="8" stroke-linejoin="round"/>

  <!-- Middle Layer (Sky Blue) -->
  <path d="M512 370 L790 510 L512 650 L234 510 Z" fill="url(#skyGrad)" fill-opacity="0.88" filter="url(#glow)"/>
  <path d="M512 370 L790 510 L512 650 L234 510 Z" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linejoin="round"/>

  <!-- Bottom Layer (Emerald Brand Core) -->
  <path d="M512 530 L790 670 L512 810 L234 670 Z" fill="url(#emeraldGrad)" fill-opacity="0.95" filter="url(#glow)"/>
  <path d="M512 530 L790 670 L512 810 L234 670 Z" fill="none" stroke="#a7f3d0" stroke-width="10" stroke-linejoin="round"/>

  <!-- Center Glowing Nexus Sphere -->
  <circle cx="512" cy="510" r="48" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="512" cy="510" r="32" fill="#10b981"/>
  <circle cx="512" cy="510" r="16" fill="#ffffff"/>
</svg>
