name: CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Check version sync (R14)
        run: node scripts/check-version-sync.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Run Node CI-A assertions (B-M9.1 + B-M2.2)
        run: npx tsx scripts/ci-a-test.ts

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Build Web Bundle
        run: npm run build

  verify-rust:
    name: Rust cargo check (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      # tauri_build::build() 依赖 frontendDist（../dist）存在，cargo check 之前必须先产出 dist。
      - name: Build Web Bundle (frontendDist)
        run: npm run build

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # CI-A 验收测试 + B-M2.2 对拍：cargo test 跑全部 Rust 单测（链接结构/进程树/数据目录/链接策略矩阵）
      - name: Run Rust tests (CI-A + B-M2.2 dump)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Dump Node link strategy table
        run: npx tsx scripts/dump-link-strategy.ts

      - name: Diff link strategy tables (B-M2.2)
        run: diff src-tauri/target/link-strategy-table.rust.txt src-tauri/target/link-strategy-table.node.txt
